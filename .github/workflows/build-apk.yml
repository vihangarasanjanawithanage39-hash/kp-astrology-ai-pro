name: Build 120Hz Offline Auto-Update KP APK & Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-live-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Web + Silent OTA Auto-Update Bundle
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository root!"
            exit 1
          fi
          rm -rf app_src www
          mkdir -p app_src www
          unzip -o "$ZIP_FILE" -d app_src

          SRC_DIR="app_src"
          if [ ! -f "$SRC_DIR/index.html" ]; then
            FOUND=$(find "$SRC_DIR" -maxdepth 3 -name "index.html" | head -n 1)
            [ -n "$FOUND" ] && SRC_DIR=$(dirname "$FOUND")
          fi

          for f in index.html index-si.html kp-ui.css kp-ui.js kp-ai.js kp-rules.js manifest.json manifest.webmanifest sw.js favicon.png icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png og-image.png astronomy.browser.min.js; do
            [ -f "$SRC_DIR/$f" ] && cp "$SRC_DIR/$f" www/
          done

          curl -fsSL https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js -o www/astronomy.browser.min.js || true
          if [ -s www/astronomy.browser.min.js ]; then
            sed -i 's|https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js|astronomy.browser.min.js|g' www/index.html www/index-si.html
          fi

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          BASE_URL="https://${OWNER_LC}.github.io/${REPO_NAME}"
          BUILD_VER="v-${GITHUB_SHA:0:10}"

          cat > www/ota-update.js << 'OTA_EOF'
          (function () {
            var CU = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorUpdater;
            if (!CU) return;
            try { CU.notifyAppReady(); } catch (e) {}

            var BASE = window.KP_OTA_BASE || '';
            var BUILT = window.KP_OTA_BUILT_VER || '';
            if (!BASE) return;

            var SI = /[\u0D80-\u0DFF]/.test((document.title || '') + (document.body ? document.body.innerText.slice(0, 200) : '')) || document.documentElement.lang === 'si';

            function showBanner(bundleId) {
              if (document.getElementById('kp-ota-bar')) return;
              var bar = document.createElement('div');
              bar.id = 'kp-ota-bar';
              bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:99;background:#0f2536;color:#eef7fb;border:1px solid #38bdf8;border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);font:600 12.5px system-ui,sans-serif';
              bar.innerHTML = '<span>✨ ' + (SI ? 'නව සංස්කරණය බාගත විය!' : 'New update downloaded!') + '</span>' +
                '<button id="kp-ota-go" style="background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#04131e;border:0;border-radius:9px;padding:7px 12px;font-weight:800;font-size:12px;min-height:32px;margin:0">' +
                (SI ? 'දැන් යොදන්න' : 'Apply Now') + '</button>';
              document.body.appendChild(bar);
              document.getElementById('kp-ota-go').onclick = function () {
                CU.set({ id: bundleId }).catch(function () {});
              };
            }

            async function checkUpdate() {
              if (!navigator.onLine) return;
              try {
                var cur = await CU.current();
                var running = (cur && cur.bundle && cur.bundle.id !== 'builtin' && cur.bundle.version) ? cur.bundle.version : BUILT;
                var resp = await fetch(BASE + '/ota-version.json?t=' + Date.now(), { cache: 'no-store' });
                if (!resp.ok) return;
                var info = await resp.json();
                if (!info || !info.version || !info.url || info.version === running) return;

                var dl = await CU.download({ url: info.url, version: info.version });
                if (dl && dl.id) {
                  try { await CU.next({ id: dl.id }); } catch (e) {}
                  showBanner(dl.id);
                  try {
                    var list = await CU.list();
                    if (list && Array.isArray(list.bundles)) {
                      list.bundles.forEach(function (b) {
                        if (b.id && b.id !== 'builtin' && b.id !== dl.id && (!cur.bundle || b.id !== cur.bundle.id)) {
                          CU.delete({ id: b.id }).catch(function () {});
                        }
                      });
                    }
                  } catch (e) {}
                }
              } catch (e) {}
            }

            window.addEventListener('load', function () { setTimeout(checkUpdate, 2800); });
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') setTimeout(checkUpdate, 1500);
            });
          })();
          OTA_EOF

          python3 - "$BUILD_VER" "$BASE_URL" << 'PY_EOF'
          import sys, os, json, zipfile
          ver, base_url = sys.argv[1], sys.argv[2]
          tag = f'<script>window.KP_OTA_BUILT_VER="{ver}";window.KP_OTA_BASE="{base_url}";</script><script src="ota-update.js"></script>'
          for fn in ['www/index.html', 'www/index-si.html']:
              if os.path.exists(fn):
                  with open(fn, 'r', encoding='utf-8') as f:
                      h = f.read()
                  if 'ota-update.js' not in h:
                      h = h.replace('</body>', tag + '</body>', 1)
                  with open(fn, 'w', encoding='utf-8') as f:
                      f.write(h)

          with open('www/ota-version.json', 'w', encoding='utf-8') as f:
              json.dump({'version': ver, 'url': base_url + '/ota-bundle.zip'}, f)

          with zipfile.ZipFile('ota-bundle.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for root, _, files in os.walk('www'):
                  for fname in sorted(files):
                      if fname == 'ota-bundle.zip':
                          continue
                      fp = os.path.join(root, fname)
                      zf.write(fp, arcname=os.path.relpath(fp, 'www'))
          os.replace('ota-bundle.zip', 'www/ota-bundle.zip')
          print('Built OTA bundle:', ver, os.path.getsize('www/ota-bundle.zip'), 'bytes')
          PY_EOF

          touch www/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Live Web + OTA Bundle
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'www'

  deploy-live-web:
    needs: build-live-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Live Web & OTA Server (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v5

  build-offline-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare 100% Offline + Silent OTA Bundle
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository root!"
            exit 1
          fi
          rm -rf app_src www
          mkdir -p app_src www
          unzip -o "$ZIP_FILE" -d app_src

          SRC_DIR="app_src"
          if [ ! -f "$SRC_DIR/index.html" ]; then
            FOUND=$(find "$SRC_DIR" -maxdepth 3 -name "index.html" | head -n 1)
            [ -n "$FOUND" ] && SRC_DIR=$(dirname "$FOUND")
          fi

          for f in index.html index-si.html kp-ui.css kp-ui.js kp-ai.js kp-rules.js manifest.json manifest.webmanifest sw.js favicon.png icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png og-image.png astronomy.browser.min.js; do
            [ -f "$SRC_DIR/$f" ] && cp "$SRC_DIR/$f" www/
          done

          curl -fsSL https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js -o www/astronomy.browser.min.js || true
          if [ -s www/astronomy.browser.min.js ]; then
            sed -i 's|https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js|astronomy.browser.min.js|g' www/index.html www/index-si.html
          fi

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          BASE_URL="https://${OWNER_LC}.github.io/${REPO_NAME}"
          BUILD_VER="v-${GITHUB_SHA:0:10}"

          cat > www/ota-update.js << 'OTA_EOF'
          (function () {
            var CU = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorUpdater;
            if (!CU) return;
            try { CU.notifyAppReady(); } catch (e) {}

            var BASE = window.KP_OTA_BASE || '';
            var BUILT = window.KP_OTA_BUILT_VER || '';
            if (!BASE) return;

            var SI = /[\u0D80-\u0DFF]/.test((document.title || '') + (document.body ? document.body.innerText.slice(0, 200) : '')) || document.documentElement.lang === 'si';

            function showBanner(bundleId) {
              if (document.getElementById('kp-ota-bar')) return;
              var bar = document.createElement('div');
              bar.id = 'kp-ota-bar';
              bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:99;background:#0f2536;color:#eef7fb;border:1px solid #38bdf8;border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);font:600 12.5px system-ui,sans-serif';
              bar.innerHTML = '<span>✨ ' + (SI ? 'නව සංස්කරණය බාගත විය!' : 'New update downloaded!') + '</span>' +
                '<button id="kp-ota-go" style="background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#04131e;border:0;border-radius:9px;padding:7px 12px;font-weight:800;font-size:12px;min-height:32px;margin:0">' +
                (SI ? 'දැන් යොදන්න' : 'Apply Now') + '</button>';
              document.body.appendChild(bar);
              document.getElementById('kp-ota-go').onclick = function () {
                CU.set({ id: bundleId }).catch(function () {});
              };
            }

            async function checkUpdate() {
              if (!navigator.onLine) return;
              try {
                var cur = await CU.current();
                var running = (cur && cur.bundle && cur.bundle.id !== 'builtin' && cur.bundle.version) ? cur.bundle.version : BUILT;
                var resp = await fetch(BASE + '/ota-version.json?t=' + Date.now(), { cache: 'no-store' });
                if (!resp.ok) return;
                var info = await resp.json();
                if (!info || !info.version || !info.url || info.version === running) return;

                var dl = await CU.download({ url: info.url, version: info.version });
                if (dl && dl.id) {
                  try { await CU.next({ id: dl.id }); } catch (e) {}
                  showBanner(dl.id);
                  try {
                    var list = await CU.list();
                    if (list && Array.isArray(list.bundles)) {
                      list.bundles.forEach(function (b) {
                        if (b.id && b.id !== 'builtin' && b.id !== dl.id && (!cur.bundle || b.id !== cur.bundle.id)) {
                          CU.delete({ id: b.id }).catch(function () {});
                        }
                      });
                    }
                  } catch (e) {}
                }
              } catch (e) {}
            }

            window.addEventListener('load', function () { setTimeout(checkUpdate, 2800); });
            document.addEventListener('visibilitychange', function () {
              if (document.visibilityState === 'visible') setTimeout(checkUpdate, 1500);
            });
          })();
          OTA_EOF

          python3 - "$BUILD_VER" "$BASE_URL" << 'PY_EOF'
          import sys, os
          ver, base_url = sys.argv[1], sys.argv[2]
          tag = f'<script>window.KP_OTA_BUILT_VER="{ver}";window.KP_OTA_BASE="{base_url}";</script><script src="ota-update.js"></script>'
          for fn in ['www/index.html', 'www/index-si.html']:
              if os.path.exists(fn):
                  with open(fn, 'r', encoding='utf-8') as f:
                      h = f.read()
                  if 'ota-update.js' not in h:
                      h = h.replace('</body>', tag + '</body>', 1)
                  with open(fn, 'w', encoding='utf-8') as f:
                      f.write(h)
          PY_EOF

          [ -f "$SRC_DIR/icon-512.png" ] && cp "$SRC_DIR/icon-512.png" ./icon-512.png

          cat > package.json << 'EOF'
          {
            "name": "kp-astrology-ai-pro",
            "version": "20.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.1.2",
              "@capgo/capacitor-updater": "^6.15.0"
            },
            "devDependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/cli": "^6.1.2"
            }
          }
          EOF

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.kpastrology.aipro",
            "appName": "KP Astrology AI Pro",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "plugins": {
              "CapacitorUpdater": {
                "autoUpdate": false,
                "resetWhenUpdate": true
              }
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#070c14"
            }
          }
          EOF

      - name: Install Capacitor + Silent OTA Updater & Generate Android Project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Enable Native 120Hz Display Mode, Hardware Acceleration & Custom Icons
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pillow || true
          python3 - << 'EOF'
          import os

          mf = 'android/app/src/main/AndroidManifest.xml'
          with open(mf, 'r', encoding='utf-8') as f:
              xml = f.read()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]
          for p in perms:
              if p not in xml:
                  xml = xml.replace('<application', p + '\n    <application', 1)
          if 'usesCleartextTraffic' not in xml:
              xml = xml.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'hardwareAccelerated' not in xml:
              xml = xml.replace('<application', '<application android:hardwareAccelerated="true"', 1)
          with open(mf, 'w', encoding='utf-8') as f:
              f.write(xml)

          ma = 'android/app/src/main/java/com/kpastrology/aipro/MainActivity.java'
          if os.path.exists(ma):
              java_code = '''package com.kpastrology.aipro;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.Display;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enableHighRefreshRate();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  enableHighRefreshRate();
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().setLayerType(View.LAYER_TYPE_HARDWARE, null);
                      }
                  } catch (Exception ignored) {}
              }

              private void enableHighRefreshRate() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          Display display = null;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              display = getDisplay();
                          }
                          if (display == null) {
                              WindowManager wm = getWindowManager();
                              if (wm != null) display = wm.getDefaultDisplay();
                          }
                          if (display != null) {
                              Display.Mode current = display.getMode();
                              Display.Mode best = current;
                              for (Display.Mode m : display.getSupportedModes()) {
                                  if (m.getPhysicalWidth() == current.getPhysicalWidth()
                                          && m.getPhysicalHeight() == current.getPhysicalHeight()
                                          && m.getRefreshRate() > best.getRefreshRate()) {
                                      best = m;
                                  }
                              }
                              WindowManager.LayoutParams lp = getWindow().getAttributes();
                              lp.preferredDisplayModeId = best.getModeId();
                              lp.preferredRefreshRate = best.getRefreshRate();
                              getWindow().setAttributes(lp);
                          }
                      }
                  } catch (Exception ignored) {}
              }
          }
          '''
              lines = [ln[10:] if ln.startswith('          ') else ln for ln in java_code.splitlines()]
              with open(ma, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(lines) + '\n')

          try:
              from PIL import Image
              if os.path.exists('icon-512.png'):
                  src = Image.open('icon-512.png').convert('RGBA')
                  sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
                  res_dir = 'android/app/src/main/res'
                  for folder, sz in sizes.items():
                      d = os.path.join(res_dir, folder)
                      if os.path.isdir(d):
                          im = src.resize((sz, sz), Image.Resampling.LANCZOS)
                          for target in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                              im.save(os.path.join(d, target), 'PNG')
                  ad = os.path.join(res_dir, 'mipmap-anydpi-v26')
                  if os.path.isdir(ad):
                      for fn in os.listdir(ad):
                          if fn.endswith('.xml'):
                              os.remove(os.path.join(ad, fn))
          except Exception as e:
              print("Icon step skipped:", e)
          EOF

      - name: Build 120Hz Offline Auto-Update APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish Direct .APK Link (GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KP-Astrology-AI-Pro-Offline.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest KP-Astrology-AI-Pro-Offline.apk --clobber
          else
            gh release create latest KP-Astrology-AI-Pro-Offline.apk \
              --title "KP Astrology AI Pro (100% Offline + Auto-Update + 120Hz)" \
              --notes "One-time install Android APK: 100% Offline, 120Hz unlocked, and Silent OTA Auto-Update."
          fi
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          WEB_URL="https://${OWNER_LC}.github.io/${{ github.event.repository.name }}/"
          DL_URL="https://github.com/${{ github.repository }}/releases/latest/download/KP-Astrology-AI-Pro-Offline.apk"
          echo "### 📲 Direct 100% Offline + Auto-Update .APK Link" >> $GITHUB_STEP_SUMMARY
          echo "[$DL_URL]($DL_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Web App & OTA Server" >> $GITHUB_STEP_SUMMARY
          echo "[$WEB_URL]($WEB_URL)" >> $GITHUB_STEP_SUMMARY
