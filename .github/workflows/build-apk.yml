name: Build 120Hz Offline Auto-Update KP APK & Web (Obfuscated)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-live-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auto-Unzip, Bundle Offline Ephemeris & Obfuscate JS
        run: |
          set -e
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository root!"
            exit 1
          fi
          echo "Building Live Web from: $ZIP_FILE"
          rm -rf app_src www
          mkdir -p app_src www
          unzip -o "$ZIP_FILE" -d app_src

          SRC_DIR="app_src"
          if [ ! -f "$SRC_DIR/index.html" ]; then
            FOUND=$(find "$SRC_DIR" -maxdepth 3 -name "index.html" | head -n 1)
            [ -n "$FOUND" ] && SRC_DIR=$(dirname "$FOUND")
          fi

          for f in index.html index-si.html kp-ui.css kp-ui.js kp-ai.js kp-rules.js manifest.json manifest.webmanifest sw.js favicon.png icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png og-image.png astronomy.browser.min.js; do
            [ -f "$SRC_DIR/$f" ] && cp "$SRC_DIR/$f" www/
          done

          curl -fsSL https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js -o www/astronomy.browser.min.js || true
          if [ -s www/astronomy.browser.min.js ]; then
            sed -i 's|https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js|astronomy.browser.min.js|g' www/index.html www/index-si.html
          fi

          # Obfuscate kp-ui.js & kp-ai.js (Fast 120Hz-Safe Protection)
          npm install --no-save --no-audit --no-fund javascript-obfuscator
          for jsf in www/kp-ui.js www/kp-ai.js; do
            if [ -f "$jsf" ]; then
              npx javascript-obfuscator "$jsf" --output "$jsf" \
                --compact true \
                --string-array true \
                --string-array-encoding base64 \
                --string-array-threshold 0.8 \
                --rename-globals false \
                --control-flow-flattening false \
                --self-defending false \
                --target browser
              echo "Obfuscated $jsf successfully."
            fi
          done

          # Generate version.json for Silent OTA Auto-Update
          VER_ID="${GITHUB_RUN_NUMBER}-$(date +%s)"
          printf '{"version":"%s","zip":"%s","builtAt":"%s"}\n' "$VER_ID" "$ZIP_FILE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > www/version.json
          touch www/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Live Web Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'www'

  deploy-live-web:
    needs: build-live-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Live Web App (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v5

  build-offline-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare 100% Offline Obfuscated Bundle & OTA Updater in www/
        run: |
          set -e
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository root!"
            exit 1
          fi
          rm -rf app_src www
          mkdir -p app_src www
          unzip -o "$ZIP_FILE" -d app_src

          SRC_DIR="app_src"
          if [ ! -f "$SRC_DIR/index.html" ]; then
            FOUND=$(find "$SRC_DIR" -maxdepth 3 -name "index.html" | head -n 1)
            [ -n "$FOUND" ] && SRC_DIR=$(dirname "$FOUND")
          fi

          for f in index.html index-si.html kp-ui.css kp-ui.js kp-ai.js kp-rules.js manifest.json manifest.webmanifest sw.js favicon.png icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png og-image.png astronomy.browser.min.js; do
            [ -f "$SRC_DIR/$f" ] && cp "$SRC_DIR/$f" www/
          done

          curl -fsSL https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js -o www/astronomy.browser.min.js || true
          if [ -s www/astronomy.browser.min.js ]; then
            sed -i 's|https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js|astronomy.browser.min.js|g' www/index.html www/index-si.html
          fi

          # Obfuscate kp-ui.js & kp-ai.js for Android APK
          npm install --no-save --no-audit --no-fund javascript-obfuscator
          for jsf in www/kp-ui.js www/kp-ai.js; do
            if [ -f "$jsf" ]; then
              npx javascript-obfuscator "$jsf" --output "$jsf" \
                --compact true \
                --string-array true \
                --string-array-encoding base64 \
                --string-array-threshold 0.8 \
                --rename-globals false \
                --control-flow-flattening false \
                --self-defending false \
                --target browser
              echo "Obfuscated $jsf for APK."
            fi
          done

          [ -f "$SRC_DIR/icon-512.png" ] && cp "$SRC_DIR/icon-512.png" ./icon-512.png
          [ -f "$SRC_DIR/package.json" ] && cp "$SRC_DIR/package.json" ./package.json
          if [ ! -f package.json ]; then
            printf '%s\n' '{"name":"kp-astrology-ai-pro","version":"43.0.0","private":true,"dependencies":{"@capacitor/core":"^6.1.2"},"devDependencies":{"@capacitor/android":"^6.1.2","@capacitor/cli":"^6.1.2"}}' > package.json
          fi

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          LIVE_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/"
          cat > www/ota-check.js << EOF
          (function(){
            var BASE='${LIVE_URL}', CUR='${GITHUB_RUN_NUMBER}';
            if(!navigator.onLine) return;
            setTimeout(function(){
              fetch(BASE+'version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
                if(!d||!d.version) return;
                var seen=localStorage.getItem('kp_ota_ver')||CUR;
                if(String(d.version).split('-')[0]===String(seen).split('-')[0]) return;
                var bar=document.createElement('div');
                bar.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:220;background:linear-gradient(135deg,#0284c7,#0f766e);color:#fff;padding:10px 12px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,0.45);font-size:12.5px;font-weight:700';
                bar.innerHTML='<span>✨ නව සංස්කරණය සූදානම්!</span><button type="button" style="background:#fff;color:#0f172a;border:0;border-radius:9px;padding:6px 11px;font-weight:800;font-size:12px;margin:0;min-height:30px">දැන් යොදන්න</button>';
                bar.querySelector('button').onclick=function(){
                  localStorage.setItem('kp_ota_ver',d.version);
                  location.href=BASE+(document.documentElement.lang==='si'?'index-si.html':'index.html')+'?v='+Date.now();
                };
                document.body.appendChild(bar);
              }).catch(function(){});
            },3500);
          })();
          EOF
          sed -i 's|</body>|<script src="ota-check.js"></script></body>|g' www/index.html www/index-si.html

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.kpastrology.aipro",
            "appName": "KP Astrology AI Pro",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#070c14"
            }
          }
          EOF

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Enable Native 120Hz, Native Android A4 PDF Print & Custom Icons
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pillow || true
          python3 - << 'EOF'
          import os

          mf = 'android/app/src/main/AndroidManifest.xml'
          with open(mf, 'r', encoding='utf-8') as f:
              xml = f.read()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]
          for p in perms:
              if p not in xml:
                  xml = xml.replace('<application', p + '\n    <application', 1)
          if 'usesCleartextTraffic' not in xml:
              xml = xml.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'hardwareAccelerated' not in xml:
              xml = xml.replace('<application', '<application android:hardwareAccelerated="true"', 1)
          with open(mf, 'w', encoding='utf-8') as f:
              f.write(xml)

          ma = 'android/app/src/main/java/com/kpastrology/aipro/MainActivity.java'
          if os.path.exists(ma):
              java_code = '''package com.kpastrology.aipro;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.view.Display;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private WebView printWebView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enableHighRefreshRate();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  enableHighRefreshRate();
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          WebView wv = getBridge().getWebView();
                          wv.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                          wv.addJavascriptInterface(new AndroidPrintBridge(), "AndroidPrint");
                      }
                  } catch (Exception ignored) {}
              }

              public class AndroidPrintBridge {
                  @JavascriptInterface
                  public void printHtml(final String htmlDoc, final String jobName) {
                      runOnUiThread(() -> {
                          try {
                              WebView wv = new WebView(MainActivity.this);
                              wv.setWebViewClient(new WebViewClient() {
                                  @Override
                                  public void onPageFinished(WebView view, String url) {
                                      PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                      if (pm != null) {
                                          String name = (jobName != null && !jobName.isEmpty()) ? jobName : "KP-Astrology-Report";
                                          PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(name);
                                          PrintAttributes attrs = new PrintAttributes.Builder()
                                                  .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                  .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                  .build();
                                          pm.print(name, adapter, attrs);
                                      }
                                      printWebView = null;
                                  }
                              });
                              wv.loadDataWithBaseURL("https://localhost/", htmlDoc, "text/html", "UTF-8", null);
                              printWebView = wv;
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void shareText(final String text, final String title) {
                      runOnUiThread(() -> {
                          try {
                              Intent sendIntent = new Intent(Intent.ACTION_SEND);
                              sendIntent.setType("text/plain");
                              sendIntent.putExtra(Intent.EXTRA_SUBJECT, title != null ? title : "KP Astrology Report");
                              sendIntent.putExtra(Intent.EXTRA_TEXT, text);
                              startActivity(Intent.createChooser(sendIntent, title != null ? title : "Share Report"));
                          } catch (Exception ignored) {}
                      });
                  }
              }

              private void enableHighRefreshRate() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          Display display = null;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) display = getDisplay();
                          if (display == null) {
                              WindowManager wm = getWindowManager();
                              if (wm != null) display = wm.getDefaultDisplay();
                          }
                          if (display != null) {
                              Display.Mode current = display.getMode();
                              Display.Mode best = current;
                              for (Display.Mode m : display.getSupportedModes()) {
                                  if (m.getPhysicalWidth() == current.getPhysicalWidth()
                                          && m.getPhysicalHeight() == current.getPhysicalHeight()
                                          && m.getRefreshRate() > best.getRefreshRate()) {
                                      best = m;
                                  }
                              }
                              WindowManager.LayoutParams lp = getWindow().getAttributes();
                              lp.preferredDisplayModeId = best.getModeId();
                              lp.preferredRefreshRate = best.getRefreshRate();
                              getWindow().setAttributes(lp);
                          }
                      }
                  } catch (Exception ignored) {}
              }
          }
          '''
              lines = [ln[10:] if ln.startswith('          ') else ln for ln in java_code.splitlines()]
              with open(ma, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(lines) + '\n')
              print("Patched MainActivity.java with 120Hz + Native A4 PDF Print + Native Share.")

          try:
              from PIL import Image
              if os.path.exists('icon-512.png'):
                  src = Image.open('icon-512.png').convert('RGBA')
                  sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
                  res_dir = 'android/app/src/main/res'
                  for folder, sz in sizes.items():
                      d = os.path.join(res_dir, folder)
                      if os.path.isdir(d):
                          im = src.resize((sz, sz), Image.Resampling.LANCZOS)
                          for target in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                              im.save(os.path.join(d, target), 'PNG')
                  ad = os.path.join(res_dir, 'mipmap-anydpi-v26')
                  if os.path.isdir(ad):
                      for fn in os.listdir(ad):
                          if fn.endswith('.xml'):
                              os.remove(os.path.join(ad, fn))
          except Exception as e:
              print("Icon step skipped:", e)
          EOF

      - name: Build 120Hz Offline Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish Direct .APK Link (GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KP-Astrology-AI-Pro-Offline.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest KP-Astrology-AI-Pro-Offline.apk --clobber
          else
            gh release create latest KP-Astrology-AI-Pro-Offline.apk \
              --title "KP Astrology AI Pro (Android APK + Windows PC .exe)" \
              --notes "100% Offline 120Hz Android APK with ECDSA Asymmetric License Protection, Obfuscated Code & Native A4 PDF."
          fi
