name: Live Auto-Update Web & Build KP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-live-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Unzip Latest ZIP for Live Auto-Update
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository root!"
            exit 1
          fi
          rm -rf app_src www
          mkdir -p app_src www
          unzip -o "$ZIP_FILE" -d app_src

          SRC_DIR="app_src"
          if [ ! -f "$SRC_DIR/index.html" ]; then
            FOUND=$(find "$SRC_DIR" -maxdepth 3 -name "index.html" | head -n 1)
            [ -n "$FOUND" ] && SRC_DIR=$(dirname "$FOUND")
          fi

          for f in index.html index-si.html kp-ui.css kp-ui.js kp-ai.js kp-rules.js manifest.json manifest.webmanifest sw.js favicon.png icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png og-image.png astronomy.browser.min.js; do
            [ -f "$SRC_DIR/$f" ] && cp "$SRC_DIR/$f" www/
          done
          touch www/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Live Web Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'www'

  deploy-live-web:
    needs: build-live-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Live Auto-Update Server (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v5

  build-live-sync-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Bundled Offline Fallback & Live-Sync Config
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository root!"
            exit 1
          fi
          rm -rf app_src www
          mkdir -p app_src www
          unzip -o "$ZIP_FILE" -d app_src

          SRC_DIR="app_src"
          if [ ! -f "$SRC_DIR/index.html" ]; then
            FOUND=$(find "$SRC_DIR" -maxdepth 3 -name "index.html" | head -n 1)
            [ -n "$FOUND" ] && SRC_DIR=$(dirname "$FOUND")
          fi

          for f in index.html index-si.html kp-ui.css kp-ui.js kp-ai.js kp-rules.js manifest.json manifest.webmanifest sw.js favicon.png icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png og-image.png astronomy.browser.min.js; do
            [ -f "$SRC_DIR/$f" ] && cp "$SRC_DIR/$f" www/
          done

          [ -f "$SRC_DIR/icon-512.png" ] && cp "$SRC_DIR/icon-512.png" ./icon-512.png
          [ -f "$SRC_DIR/package.json" ] && cp "$SRC_DIR/package.json" ./package.json
          if [ ! -f package.json ]; then
            printf '%s\n' '{"name":"kp-astrology-ai-pro","version":"11.0.0","private":true,"dependencies":{"@capacitor/core":"^6.1.2"},"devDependencies":{"@capacitor/android":"^6.1.2","@capacitor/cli":"^6.1.2"}}' > package.json
          fi

          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          LIVE_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/"
          echo "Configured Live Auto-Update URL: $LIVE_URL"

          cat > capacitor.config.json << EOF
          {
            "appId": "com.kpastrology.aipro",
            "appName": "KP Astrology AI Pro",
            "webDir": "www",
            "server": {
              "url": "${LIVE_URL}",
              "errorPath": "index.html",
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["${OWNER_LC}.github.io"]
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#060d14"
            }
          }
          EOF

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Apply Custom Midnight-Cyan App Icons & Permissions
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages --quiet pillow || true
          python3 - << 'EOF'
          import os
          mf = 'android/app/src/main/AndroidManifest.xml'
          with open(mf, 'r', encoding='utf-8') as f:
              xml = f.read()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]
          for p in perms:
              if p not in xml:
                  xml = xml.replace('<application', p + '\n    <application', 1)
          if 'usesCleartextTraffic' not in xml:
              xml = xml.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          with open(mf, 'w', encoding='utf-8') as f:
              f.write(xml)

          try:
              from PIL import Image
              if os.path.exists('icon-512.png'):
                  src = Image.open('icon-512.png').convert('RGBA')
                  sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
                  res_dir = 'android/app/src/main/res'
                  for folder, sz in sizes.items():
                      d = os.path.join(res_dir, folder)
                      if os.path.isdir(d):
                          im = src.resize((sz, sz), Image.Resampling.LANCZOS)
                          for target in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                              im.save(os.path.join(d, target), 'PNG')
                  ad = os.path.join(res_dir, 'mipmap-anydpi-v26')
                  if os.path.isdir(ad):
                      for fn in os.listdir(ad):
                          if fn.endswith('.xml'):
                              os.remove(os.path.join(ad, fn))
          except Exception as e:
              print("Icon step skipped:", e)
          EOF

      - name: Build Live-Sync Auto-Update APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish Direct .APK Link (GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KP-Astrology-AI-Pro-AutoUpdate.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest KP-Astrology-AI-Pro-AutoUpdate.apk --clobber
          else
            gh release create latest KP-Astrology-AI-Pro-AutoUpdate.apk \
              --title "KP Astrology AI Pro (Auto-Update Edition)" \
              --notes "One-time install APK with automatic live updates via GitHub Pages + offline fallback."
          fi
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          WEB_URL="https://${OWNER_LC}.github.io/${{ github.event.repository.name }}/"
          DL_URL="https://github.com/${{ github.repository }}/releases/latest/download/KP-Astrology-AI-Pro-AutoUpdate.apk"
          echo "### 📲 Direct Auto-Update .APK Download Link" >> $GITHUB_STEP_SUMMARY
          echo "[$DL_URL]($DL_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Live Web App (Auto-Sync Source)" >> $GITHUB_STEP_SUMMARY
          echo "[$WEB_URL]($WEB_URL)" >> $GITHUB_STEP_SUMMARY
